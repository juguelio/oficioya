name: Supabase migrations

# Aplica las migraciones pendientes cuando se mergea a main.
# En los PR sólo corre `db diff --dry-run`: valida sin tocar producción.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  pull_request:
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  # Nunca dos pushes a la base a la vez: el historial de migraciones no tolera carreras.
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link al proyecto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"

      # En PR: sólo mostrar qué se aplicaría. No escribe nada.
      - name: Dry run (PR)
        if: github.event_name == 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --dry-run

      - name: Aplicar migraciones (main)
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD:  ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push
