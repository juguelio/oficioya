<!-- Supabase → Authentication → Emails → "Reset password".
     Asunto sugerido: Cambiá tu contraseña de Oficio -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#F7F6F2;padding:32px 16px;font-family:Helvetica,Arial,sans-serif">
  <tr><td align="center">
    <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#FFFFFF;border:1px solid #ECEAE4;border-radius:16px;overflow:hidden">
      <tr><td style="background:#1E6FA5;padding:24px 28px">
        <span style="color:#FFFFFF;font-size:20px;font-weight:800;letter-spacing:-0.5px">OFICIO</span>
      </td></tr>
      <tr><td style="padding:28px">
        <h1 style="margin:0 0 12px;font-size:22px;color:#1A1714;letter-spacing:-0.5px">Cambiá tu contraseña</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#5C574F">
          Pediste recuperar el acceso a tu cuenta. Tocá el botón y elegí una contraseña nueva.
        </p>
        <table cellpadding="0" cellspacing="0"><tr><td style="background:#1E6FA5;border-radius:999px">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 28px;color:#FFFFFF;font-size:15px;font-weight:700;text-decoration:none">Elegir contraseña nueva</a>
        </td></tr></table>
        <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#9C9589">
          Si no lo pediste vos, no hagas nada: tu contraseña actual sigue funcionando.
        </p>
      </td></tr>
      <tr><td style="padding:16px 28px;border-top:1px solid #ECEAE4;font-size:12px;color:#9C9589">
        oficioya.app · San Martín de los Andes, Neuquén
      </td></tr>
    </table>
  </td></tr>
</table>
