<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light mode "Azul Andino": el color de la barra del navegador es el fondo de página. -->
    <meta name="theme-color" content="#F7F6F2" />

    <!-- SEO local — canal natural: "electricista san martín de los andes" en Google -->
    <title>Oficio — La guía de oficios de San Martín y Junín de los Andes</title>
    <meta
      name="description"
      content="Electricistas, plomeros, gasistas, cerrajeros y más en San Martín de los Andes y Junín de los Andes. Buscá por rubro y contactalos directo por WhatsApp."
    />
    <meta
      name="keywords"
      content="electricista san martín de los andes, plomero san martín de los andes, gasista junín de los andes, cerrajero san martín de los andes, oficios junín de los andes, servicios neuquén"
    />
    <!-- Canonical y OG por defecto (home). Cada ruta los pisa con useSeo. -->
    <link rel="canonical" href="https://www.oficioya.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Oficio" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://www.oficioya.app/" />
    <meta property="og:title" content="Oficio — La guía de oficios de San Martín y Junín de los Andes" />
    <meta
      property="og:description"
      content="Electricistas, plomeros, gasistas, cerrajeros y más en el radio San Martín + Junín. Contacto directo por WhatsApp, sin intermediarios."
    />
    <!-- SIN og:image a propósito. La preview de WhatsApp mostraba `hero-lanin.png`
         (el volcán del hero viejo de Stitch), una imagen que la app ya no usa en
         ninguna pantalla y que no es la identidad de Oficio. Hasta que haya una
         placa de marca aprobada, es preferible una preview de texto —título,
         descripción y dominio— antes que seguir firmando cada link compartido con
         el arte equivocado. Cómo sumarla cuando exista: docs/social-preview.md -->

    <!-- Twitter — `summary` (tarjeta chica) porque no hay imagen; `summary_large_image`
         sin og:image degrada a una tarjeta vacía. -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Oficio — La guía de oficios de San Martín y Junín de los Andes" />
    <meta
      name="twitter:description"
      content="Electricistas, plomeros, gasistas, cerrajeros y más en el radio San Martín + Junín. Contacto directo por WhatsApp, sin intermediarios."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Raleway:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
